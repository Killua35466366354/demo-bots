name: Gold-Bot (Demo)

# Läuft erst, wenn Kiron die Repository-Variable GOLD_BOT_ENABLED auf true setzt und die drei
# Capital.com-Secrets hinterlegt. Ohne Abschnitt gold: in config/limits.yaml (oder mit stage: 0)
# rechnet er nur und schreibt ins Journal, ohne Order.
# Uhr: Kirons cron-job.org-Auftrag "Gold-Bot" stößt den Lauf jede Stunde zur Minute 11 an. Die GitHub-Zeitpläne
# (11 und 41) sind seit 05.11.2026 weg: Sie liefen selten pünktlich, und wenn, dann doppelt neben cron-job.org, und
# jeder Doppellauf kostete eine Minute. Fällt cron-job.org aus, soll das ein Alarm von außen melden (Kritik T2).
# Öffentliches Repo seit November 2026 (keine Actions-Minuten). Den Takt für den Aktien-Wächter und die
# Samstagsläufe gibt jetzt takt.yml im privaten Repo, deshalb fehlt er hier.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur rechnen, keine Order"
        required: false
        default: true
        type: boolean
      login_check:
        description: "Nur den Login prüfen, keine Kurse und keine Order (live nur nach Kirons Ja)"
        required: false
        default: aus
        type: choice
        options: [aus, demo, live]

permissions:
  contents: write

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  run:
    if: vars.GOLD_BOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    # Immer GitHubs Rechner: In einem öffentlichen Repo kostet das keine Minuten, und ein eigener Rechner wäre hier
    # ein Sicherheitsrisiko.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Den neuesten Stand des Zweigs holen, nicht den Stand beim Auslösen: Wartet ein Lauf auf den vorigen
      # (concurrency), sieht er sonst ein altes journal/gold-state.json und rechnet dieselbe Kerze noch einmal
      # (04.11.2026, 00:11 UTC: GitHub-Zeitplan direkt nach dem cron-job.org-Lauf, Journal-Konflikt, Lauf rot).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests (ohne grüne Tests kein Lauf)
        run: python -m pytest -q tests/test_gold_bot.py tests/test_gold_port.py tests/test_gold_strategies_unchanged.py

      - name: Gold-Bot
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          LOGIN_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.login_check || 'aus' }}
        run: |
          if [ "$LOGIN_CHECK" != "aus" ]; then
            python -m gold.bot.login_check "$LOGIN_CHECK"
          elif [ "$DRY_RUN" = "true" ]; then
            python -m gold.bot.runner --dry-run
          else
            python -m gold.bot.runner
          fi

      # Gold-Bot 2.0 im Schatten (Kirons Wunsch vom 02.11.2026): rechnet jede Stunde mit, sendet nie eine Order und
      # schreibt nur journal/gold2-schatten.json und .jsonl. 2.0 hat Runde 3 nicht bestanden, das hier sammelt nur
      # neue Daten. Ein Fehler hier stoppt weder den Demo-Bot noch das Sichern des Journals.
      - name: Gold-Bot 2.0 Schattenlauf (ohne Order)
        if: github.event_name != 'workflow_dispatch' || inputs.login_check == 'aus'
        continue-on-error: true
        timeout-minutes: 3
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
        run: python -m gold.v2.schatten

      - name: Journal sichern
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add journal/
          if git diff --cached --quiet; then
            echo "Nichts Neues im Journal"
          else
            git commit -m "Gold-Bot: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
