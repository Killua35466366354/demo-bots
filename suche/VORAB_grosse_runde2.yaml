  melden:
    je_variante: >-
      Trades, Trades je Woche, Gewinnfaktor, Summe in R, Trefferquote, robust, Hälften, 2026, Long und Short, je
      Markt, ohne die 5 besten Trades, Zufallsvergleich (Rang, p, z), Auskunft vor dem Fenster, dazu der größte
      Verlust, der mittlere Gewinn, das tiefste Tal und die mittlere und längste Haltedauer.
