# Demo-Bots der Strategie-Suche Runde 3 (suche/demo_bots.py). Nur Capital.com-DEMO, nie echtes Geld.
# Die Bots kommen aus dem Backtest März bis Oktober 2026 (suche/VORAB_runde3.yaml, Kirons Regel: die besten 5 nach
# Gewinnfaktor über 1,2, je Markt einer, kein Gold). Ergebnis vom 03.11.2026, suche/PROTOKOLL.md (Runde 3).
# Ehrlich: 43 Varianten kamen über die Regel, reiner Zufall schaffte im Schnitt 53. Die 5 können Glück sein.
aktiv: true
handelstage: 4
# Kirons Wunsch vom 03.11.2026, 09:45 UTC: alle Bots eine Woche live auf Capital.com (Demo), jeder auf einem eigenen
# Konto. Das Testende rückt deshalb von Mo 09.11. 07:14 auf Di 10.11. 09:45 UTC (10:45 Uhr Berlin).
wochentest_ende_utc: "2026-11-10T09:45:00"   # Ende des Wochen-Tests (12-h-Bericht und Auswertung am 10.11.)
# Brent: am 04.11.2026 mit Kirons Auswahl (suche/auswahl.yaml) abgeschaltet, seit 05.11.2026 als Labor-Bot wieder auf
# Account 1 (suche/VORAB_labor.yaml, Kirons Ja vom 05.11. 11:07 UTC). ende_utc ist das Ende seines Laufs; geprüft wird
# er wie alle Demo-Bots nach suche/VORAB_wechsel.yaml. Die abgelösten Bots unten öffnen nichts Neues mehr.
ende_utc: "2027-01-29T21:00:00"
eigene_konten: true            # jeder Bot ein eigenes Demokonto, sobald Kiron es angelegt hat (gold/bot/konten.py)
reserve_margin_eur: 400        # so viel Margin bleibt auf dem Hauptkonto immer frei, damit der Gold-Bot handeln kann
reserve_margin_eigen_eur: 0    # auf einem eigenen Konto muss nur die Margin der eigenen Order frei sein
max_risiko_eur: 10             # mehr Risiko je Trade bei der kleinsten Größe: dann kein Einstieg
max_tagesverlust_r: 6          # haben die Demo-Bots heute zusammen 6 R verloren, öffnet keiner mehr
# Kirons Wunsch vom 04.11.2026: die Demokonten sind am Maximum, also bekommen die besten Strategien der gleichen
# Bewertung 2025-2026 (suche/VORAB_bewertung.yaml, Ergebnis in journal/portfolio.json) die Konten der schwächeren. Ein
# abgelöster Bot öffnet keinen neuen Trade; seine offene Position läuft nach seinen Regeln zu Ende, dann schreibt der
# Lauf sein Konto in journal/konten.json auf den Nachfolger um (us500_bot, r7_nasdaq_bot und r6_bots lesen es dort).
# Vortag USD/JPY (Konto "Vortag USDJPY") gibt sein Konto an Vortag GBP/USD ab; das macht der Lauf der Runde-6-Bots.
abgeloest:
  j225: {an: r7-nasdaq-noise-long, seit: "2026-11-04", grund: "Bewertung 2025-2026: Japan 225 PF 1,26, 2025 unter 1 (0,80), nicht bestanden. Nasdaq Noise Long PF 3,54, bestanden (Rang 2)."}
  us30: {an: r5-ruecksetzer-us100, seit: "2026-11-04", grund: "Bewertung 2025-2026: Dow 15 Min. Short PF 1,19, nicht bestanden. Trend-Rücksetzer US100 PF 1,91, bestanden (Rang 3)."}
  copper: {an: r6-vortag-eurusd, seit: "2026-11-04", grund: "Bewertung 2025-2026: Kupfer PF 1,02, nicht bestanden. Vortag EUR/USD PF 1,67, bestanden (Rang 4)."}
  intc: {an: r5-ruecksetzer-us30, seit: "2026-11-04", grund: "Bewertung 2025-2026: Intel PF 1,13, nicht bestanden. Trend-Rücksetzer Dow PF 1,48, bestanden (Rang 6)."}
  gold2: {an: r6-london-gbpusd, seit: "2026-11-04", grund: "Bewertung 2025-2026: Gold-Bot 2.0 PF 1,04, nicht bestanden. London GBP/USD PF 1,45, bestanden (Rang 7)."}
  dax: {an: r6-noise-usdjpy, seit: "2026-11-04", grund: "Bewertung 2025-2026: DAX PF 1,01, nicht bestanden. Noise USD/JPY PF 1,39, bestanden (Rang 8)."}
# D6 (10.11.2026, Ende des Wochen-Tests): die abgelösten Bots j225, us30, copper, intc, gold2 und dax ohne offene
# Position sind aus der Liste und dem Wochenbericht raus. "abgeloest" oben bleibt als Nachweis, wer welches Konto bekam.
regel_text: "Backtest März bis Oktober 2026, die 5 besten Varianten nach Gewinnfaktor (über 1,2, mindestens 30 Trades, je Markt eine). 4 Handelstage Demo mit der kleinsten Ordergröße. Gut = Summe R über 0 und Gewinnfaktor ab 1,2 bei mindestens 3 Trades."
bots:
- id: oil-brent
  epic: OIL_BRENT
  name: Brent-Öl
  konto_namen: [brent, öl, oil]     # passt ein Kontoname, bekommt dieser Bot das Konto
  typ: COMMODITIES
  zeitrahmen: 30min
  logik: gold
  seiten: nur C
  backtest:
    trades: 56
    pf_r: 2.12
    win_pct: 30.4
    sum_r: 43.8
    zufall_gleich_gut_pct: 3.5
  hinweis: Nur Long (C). Ohne die 3 besten Trades Gewinnfaktor 1,33. Zufall gleich gut in 3,5 % der Läufe.
# Extra-Bots außerhalb der Runde-3-Regel (die gilt nur für "bots" oben und für die Auswertung der Strategie-Suche).
# Bis 10.11.2026 standen hier Gold-Bot 2.0 (gold2) und DAX (dax), beide auf Kirons Wunsch vom 03.11.2026 eine Woche
# auf eigenem Demokonto. Beide sind seit 04.11. abgelöst (siehe "abgeloest" oben) und seit D6 aus der Liste raus.
extra_regel_text: "Gold-Bot 2.0 und DAX haben Runde 3 nicht bestanden. Sie handelten nur, weil Kiron alle Bots eine Woche live sehen wollte, jeder auf einem eigenen Demokonto."
extra_bots: []
