name: Demo-Bots (Strategie-Suche, nur Demokonto)

# Alle Demo-Bots außer dem Gold-Bot und dem 5-Minuten-Lauf in EINEM Lauf (nur Capital.com-DEMO, nie echtes Geld).
# Stand 11.11.2026 handeln hier: Vortag EUR/USD, GBP/USD, GBP/JPY und der Mess-Bot Vortag EUR/USD 1 x ATR, London
# GBP/USD und Noise USD/JPY (alle suche/r6_bots.py), die Top 3 auf dem Konto "US500" (US500-Rücksetzer,
# US100-Rücksetzer, Nasdaq Noise-Band Long; suche/us500_bot.py, suche/r7_nasdaq_bot.py), der Dow-Rücksetzer, die
# Gold Groß-Box (gold/grossbox_bot.py), der Gold 4-Std.-Ausbruch (gold/ausbruch4h_bot.py) und seit 19.11.2026 der
# 4-Std.-Ausbruch DAX, FTSE, Nikkei (suche/welt4h_bot.py), seit 20.11.2026 Bollinger Krypto umgedreht
# (suche/krypto_bollinger_bot.py), das Vorhersage-Modell Indizes (suche/modell_indizes_bot.py), der Tag nach einem
# VIX-Sprung (suche/vix_sprung_bot.py), Williams %R auf US500 und US100 (suche/williams_bot.py) und der
# 4-Std.-Ausbruch auf Bitcoin und Ether (suche/krypto4h_bot.py), dazu zwei Bündel (suche/buendel_bot.py), die Trades
# anderer Bots auf "Vortag USDJPY" kopieren: buendel9 ohne Gold und seit 26.11.2026 das Gold-Bündel. Gold-Short-Bot und Gold-Hand-Bot ruhen. Die alten
# Runde-3-Bots in suche/demo_bots.py sind alle abgelöst und öffnen nichts mehr. Pine-Bots, Scalper und Gold-Staffel laufen im
# 5-Minuten-Lauf (pine5m.yml). Welcher Bot auf welchem Konto handelt, steht in CLAUDE.md.
#
# Uhr: Kirons cron-job.org-Auftrag "Demo-Bots", Minute 1, 16, 31 und 46, seit Kirons Wunsch vom 05.11.2026 17:33 UTC
# jeden Tag rund um die Uhr. Im öffentlichen Repo kostet ein Lauf keine Minuten, das Fenster 10 bis 22 Uhr Berlin
# (Sparen vom 05.11.2026 morgens) brauchte es nicht mehr. Davon hatten zwei Bots weniger als ihre Regel erlaubt: Brent
# (30-Minuten-Signale rund um die Uhr, Backtest ohne Uhrzeit-Grenze) verlor jedes Nachtsignal, Noise USD/JPY
# (Sitzung ab 8 Uhr London = 9 Uhr Berlin) seine erste Stunde. Wann ein Bot handeln darf, steht allein in seinen
# Regeln (Vortag 4:30 bis 16:45 New York, US-Bots in der US-Sitzung, London-Bot am Londoner Morgen); außerhalb davon
# rechnet ein Lauf nur und öffnet nichts. Jeder Lauf soll unter einer Minute bleiben. Offene Positionen haben ihren
# Stop beim Broker.
#
# Getrennt vom Gold-Bot-Lauf: Dieser Lauf schreibt nur journal/demo-bots*, journal/konten.json und journal/stimmung.jsonl, der Gold-Bot nur seine eigenen Dateien. So
# kann ein Fehler hier nie das Journal des Gold-Bots stören. Gleiche Gruppe wie der Gold-Bot: Beide laufen nie
# gleichzeitig, der Gold-Bot hat damit immer seine eigene Sitzung bei Capital.com.
# Öffentliches Repo seit November 2026: keine Actions-Minuten, die Uhr bleibt cron-job.org.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur rechnen, keine Order"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  run:
    # Immer GitHubs Rechner: In einem öffentlichen Repo kostet das keine Minuten, und ein eigener Rechner wäre hier
    # ein Sicherheitsrisiko.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Mit dem Namen des Zweigs statt des festen Stands beim Anstoßen: Wartete der Lauf hinter dem Gold-Bot, holt er
      # so trotzdem den neuesten Stand der Demo-Bots.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Tests nur nach einer Code-Änderung und einmal am Tag (Minuten sparen, 05.11.2026): Die Tests brauchten gut die
      # Hälfte jedes 15-Minuten-Laufs, obwohl sich der Code zwischen zwei Läufen fast nie ändert. Der Schlüssel ist der
      # Stand aller Dateien außer journal/ und inbox/ plus das Datum. Waren alle sechzehn Testgruppen mit genau diesem Stand
      # heute schon grün, springt jede Gruppe darüber. Sonst gilt wie immer: ohne grüne Tests kein Lauf.
      - name: Code-Stand für die Tests
        id: code
        run: |
          mkdir -p .tests-ok
          stand=$(git ls-tree -r HEAD | awk -F'\t' '$2 !~ /^(journal|inbox)\//' | sha256sum | cut -c1-16)
          echo "key=demo-tests-$(date -u +%F)-$stand" >> "$GITHUB_OUTPUT"

      - name: Heute mit diesem Stand schon grün?
        id: tests_ok
        uses: actions/cache/restore@v4
        with:
          path: .tests-ok
          key: ${{ steps.code.outputs.key }}
          lookup-only: true

      - name: Tests (ohne grüne Tests kein Lauf)
        env:
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_demo_bots.py tests/test_konten.py
            touch .tests-ok/demo
          fi

      - name: Prüfung nach 15/40 Demo-Trades (deutlich schlechtere Bots wechseln, suche/VORAB_wechsel.yaml)
        id: pruefung
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_demo_pruefung.py tests/test_labor.py
            touch .tests-ok/pruefung
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.demo_pruefung --dry-run
          else
            python -m suche.demo_pruefung
          fi

      # Die Runde-3-Bots dieses Schritts sind alle abgelöst und öffnen nichts mehr. Der Schritt bleibt trotzdem: Er liest
      # bei jedem Lauf die Kontoliste von Capital.com und hält journal/konten.json (Namen und Kontostände aller Konten)
      # und journal/demo-bots.json aktuell. Vergleich, Wochenbericht und Cockpit lesen diese Dateien.
      - name: Demo-Bots
        id: demo_bots
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.demo_bots --dry-run
          else
            python -m suche.demo_bots
          fi

      # Trend-Rücksetzer US500 (Runde 5b bestanden, Kirons Regel: gute Strategien auf eigene Demo-Konten): eigener
      # Vorwärtstest auf einem eigenen neuen Demokonto (Name "US500"), Entscheidung einmal am Tag um 15 Uhr New York
      # (suche/us500_bot.py, suche/VORAB_us500.yaml). Ein Fehler hier hält die anderen Bots und das Journal nie auf.
      - name: Trend-Rücksetzer US500
        id: us500
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_us500_bot.py tests/test_suche_runde5.py
            touch .tests-ok/us500
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.us500_bot --dry-run
          else
            python -m suche.us500_bot
          fi

      # Runde 6 (Kirons Wahl vom 04.11.2026): Vortageshoch/-tief USD/JPY (bestanden), London-Stunde GBP/USD und
      # Noise-Band USD/JPY (knapp nicht bestanden, Kirons Wunsch), jeder nur auf einem eigenen Demokonto mit passendem
      # Namen ("Vortag", "London"/"GBPUSD", "Noise"). Dazu der Zwilling: Backtest-Motor auf den Capital.com-Kerzen jedes
      # fertigen Tages, mit EUR/USD und GBP/USD als Schatten (suche/r6_bots.py, suche/VORAB_r6_demo.yaml). Ein Fehler hier
      # hält die anderen Bots und das Journal nie auf.
      - name: Runde-6-Bots (Vortag USD/JPY, EUR/USD, GBP/USD; London GBP/USD; Noise USD/JPY)
        id: r6
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_r6_bots.py
            touch .tests-ok/r6
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.r6_bots --dry-run
          else
            python -m suche.r6_bots
          fi

      # Runde 7 (Kirons Wahl vom 04.11.2026 "Nur Nasdaq Noise-Band Long"): Noise-Band nur Long auf US100, Notstop 5 x
      # Tages-ATR, raus am 5. Handelstag um 16 Uhr New York, nur auf einem eigenen Demokonto mit "Nasdaq" im Namen
      # (suche/r7_nasdaq_bot.py, suche/VORAB_r7_nasdaq.yaml). Ein Fehler hier hält die anderen Bots und das Journal nie auf.
      - name: Noise-Band Long Nasdaq (Runde 7)
        id: r7
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_r7_nasdaq_bot.py
            touch .tests-ok/r7
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.r7_nasdaq_bot --dry-run
          else
            python -m suche.r7_nasdaq_bot
          fi

      # Gold-Short-Bot (Kirons Wunsch vom 06.11.2026 12:51 UTC): die große Strategie nur Shorts aus Runde 12h
      # (portfolio-manager suche/VORAB_runde12h.yaml, Variante gross_short, im Backtest durchgefallen, PF_R 0,94) auf
      # Konto 5, das er mit dem Dow-Laborbot teilt. Nur Demo, nie das Hauptkonto des Gold-Bots. Regeln und Urteil in
      # suche/VORAB_gold_short.yaml, Code gold/short_bot.py. Schreibt nur journal/gold-short/ und journal/gold-short.json.
      # Ein Fehler hier hält die anderen Bots und das Journal nie auf.
      # Seit Kirons Wahl vom 06.11.2026 ruht der Gold-Short-Bot: Konto 5 gehört dem Gold-Hand-Bot (nächster Schritt), der
      # dieselben Shorts ohne Stop nimmt. Zwei Gold-Bots ohne Hedging auf einem Konto würden sich gegenseitig Positionen
      # schließen. Die Tests laufen weiter, der Bot öffnet nichts mehr. Er hatte bis dahin keinen Trade.
      - name: Gold-Short-Bot (ruht, Konto 5 an den Gold-Hand-Bot)
        id: gold_short
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_gold_short.py tests/test_tiktok_schatten.py
            touch .tests-ok/gold_short
          fi
          echo "Gold-Short-Bot ruht seit 06.11.2026 (Kirons Wahl: Konto 5 an den Gold-Hand-Bot), keine Order"

      # Gold-Hand-Bot (Kirons Wunsch vom 06.11.2026 15:51 UTC): Einstiege der drei Seiten des Gold-Short-Bots, Shorts und
      # Longs, ohne Stop und Ziel, mit Trade-Abfänger (Kirons Wunsch vom 06.11.2026 17:49 UTC). Kiron bekommt über
      # ntfy eine Nachricht und schließt selbst. Nur Demo, Account 5,
      # nie das Hauptkonto des Gold-Bots. Regeln in suche/VORAB_gold_hand.yaml, Code gold/hand_bot.py. Schreibt nur
      # journal/gold-hand/ und journal/gold-hand.json. Ein Fehler hier hält die anderen Bots und das Journal nie auf.
      - name: Gold-Hand-Bot (Short und Long mit Trade-Abfänger, Nachricht aufs Handy)
        id: gold_hand
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          NTFY_THEMA: ${{ secrets.NTFY_THEMA }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_gold_hand.py
            touch .tests-ok/gold_hand
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m gold.hand_bot --dry-run
          else
            python -m gold.hand_bot
          fi

      # Gold Groß-Box (Kirons Wahl vom 10.11.2026 17:35 UTC nach der neuen Bewertung 2024-26): die große Box aus
      # Runde 12d (Seite gross_box), Kauf und Verkauf, ein Drittel bei 1 R, dann Einstand, der Rest bis zur neuen Box,
      # 5 € Risiko je Trade, höchstens 3 offen. Nur Demo, Account 6 (geteilt mit dem Laborbot London GBP/USD), nie das
      # Hauptkonto des Gold-Bots. Regeln in suche/VORAB_gold_grossbox.yaml, Code gold/grossbox_bot.py. Schreibt nur
      # journal/gold-grossbox/ und journal/gold-grossbox.json. Ein Fehler hier hält die anderen Bots und das Journal nie auf.
      - name: Gold Groß-Box (Account 6)
        id: grossbox
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_grossbox_bot.py
            touch .tests-ok/gold_grossbox
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m gold.grossbox_bot --dry-run
          else
            python -m gold.grossbox_bot
          fi

      # Gold 4-Std.-Ausbruch mit Tagestrend (Kirons Wahl vom 11.11.2026 19:59 UTC auf der Karte zur Gold-Matrix): der
      # nächste Kandidat der Gold-Matrix, im Test knapp nicht bestanden. Kauf und Verkauf nach dem Schluss einer
      # 4-Std.-Kerze, Stop beim Broker, Ausstieg nach 4 fertigen 4-Std.-Kerzen, 5 € Risiko, höchstens ein Trade. Nur
      # Demo, Account 4 (geteilt mit dem Kern-Bot Vortag EUR/USD), nie das Hauptkonto des Gold-Bots. Regeln in
      # suche/VORAB_gold_ausbruch4h_bot.yaml, Code gold/ausbruch4h_bot.py. Er rechnet nur kurz nach dem Schluss einer
      # 4-Std.-Kerze (sechsmal am Tag) und schreibt nur journal/gold-ausbruch4h/ und journal/gold-ausbruch4h.json. Ein
      # Fehler hier hält die anderen Bots und das Journal nie auf.
      - name: Gold 4-Std.-Ausbruch (Account 4)
        id: ausbruch4h
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_ausbruch4h_bot.py
            touch .tests-ok/gold_ausbruch4h
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m gold.ausbruch4h_bot --dry-run
          else
            python -m gold.ausbruch4h_bot
          fi

      # 4-Std.-Ausbruch DAX, FTSE 100, Nikkei 225 mit Ziel 1 R (Kirons Wahl vom 19.11.2026 12:23 UTC auf der Karte
      # "Soll der 4-Std.-Ausbruch DAX, FTSE und Nikkei zusätzlich als Demo-Bot handeln?"): der Kandidat der Runde
      # "Kirons Notizen", im Test nicht bestanden. Kauf und Verkauf nach dem Schluss einer 4-Std.-Kerze, Stop und Ziel
      # beim Broker, Ausstieg nach 4 fertigen 4-Std.-Kerzen, 5 € Risiko, höchstens ein Trade je Markt. Nur Demo,
      # Account 7 (geteilt mit dem Labor-Bot Noise USD/JPY), nie das Hauptkonto des Gold-Bots. Regeln in
      # suche/VORAB_welt_ausbruch4h_bot.yaml, Code suche/welt4h_bot.py. Er rechnet nur kurz nach dem Schluss einer
      # 4-Std.-Kerze und schreibt nur journal/welt-ausbruch4h/ und journal/welt-ausbruch4h.json. Ein Fehler hier hält
      # die anderen Bots und das Journal nie auf.
      - name: 4-Std.-Ausbruch DAX, FTSE, Nikkei (Account 7)
        id: welt4h
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_welt4h_bot.py
            touch .tests-ok/welt_ausbruch4h
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.welt4h_bot --dry-run
          else
            python -m suche.welt4h_bot
          fi

      # Bollinger und RSI auf Bitcoin und Ether, umgedreht (Kirons Wahl vom 20.11.2026 11:53 UTC: "die paar stärksten
      # zu erst", aus dem Schatten direkt als Demo-Bot): die Fassung bollinger_umkehr_krypto_weit der Runde "Kirons
      # Notizen", im Test nicht bestanden. Nach dem Schluss einer Stundenkerze außerhalb des Bollinger-Bands mit RSI im
      # Extrem handelt er die Gegenrichtung, Stop 1,5 ATR und Ziel 2 R beim Broker, Ausstieg spätestens nach 24 Stunden,
      # 5 € Risiko, höchstens ein Trade je Markt. Nur Demo, Account 3 (geteilt mit dem Bot Vortag GBP/JPY), nie das
      # Hauptkonto des Gold-Bots. Regeln in suche/VORAB_krypto_bollinger_bot.yaml, Code suche/krypto_bollinger_bot.py.
      # Er rechnet nur in den ersten 20 Minuten einer Stunde und schreibt nur journal/krypto-bollinger/ und
      # journal/krypto-bollinger.json. Ein Fehler hier hält die anderen Bots und das Journal nie auf.
      - name: Bollinger Krypto umgedreht (Account 3)
        id: krypto_bollinger
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_krypto_bollinger_bot.py
            touch .tests-ok/krypto_bollinger
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.krypto_bollinger_bot --dry-run
          else
            python -m suche.krypto_bollinger_bot
          fi

      # Vorhersage-Modell auf US500, US100, DAX, FTSE 100 und Nikkei 225 (Kirons Wahl vom 20.11.2026 12:25 UTC auf der
      # Karte "Welches Vorhersage-Modell soll Bot 2 werden?": "Modell Indizes, jetzt bauen"): die Fassung
      # modell_indizes der großen Runde, im Test nicht bestanden (Kandidat). Ab 18:00 New York schätzt das Modell aus
      # Kursen des Vortags, VIX und US-Renditen, ob der Index bis 15:55 New York steigt, kauft ab 54 % und verkauft bis
      # 46 %. Stop 2 ATR beim Broker, kein Ziel, Ausstieg vor 15:55 New York, 5 € Risiko, höchstens ein Trade je Markt.
      # Nur Demo, Account 6 (geteilt mit der Gold Groß-Box und dem London-Bot), nie das Hauptkonto des Gold-Bots.
      # Regeln in suche/VORAB_modell_indizes_bot.yaml, Code suche/modell_indizes_bot.py. Er holt Kerzen, VIX und
      # Renditen nur ab 18:00 New York in den ersten Minuten nach dem ersten Kurs und schreibt nur
      # journal/modell-indizes/ und journal/modell-indizes.json. Ein Fehler hier hält die anderen Bots und das Journal
      # nie auf.
      - name: Vorhersage-Modell Indizes (Account 6)
        id: modell_indizes
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_modell_indizes_bot.py
            touch .tests-ok/modell_indizes
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.modell_indizes_bot --dry-run
          else
            python -m suche.modell_indizes_bot
          fi

      # Tag nach einem VIX-Sprung auf US500, US100, DAX, FTSE 100 und Nikkei 225 (Kirons Wunsch vom 20.11.2026: die
      # stärksten Kandidaten direkt als Demo-Bot, "baue danach aber weiter aus"): die Fassungen vix_sprung_us und
      # vix_sprung_welt der großen Runde, im Test nicht bestanden (Kandidat). Ist der VIX am letzten Handelstag um
      # mindestens 10 % gestiegen, kauft er ab 18:00 New York. Stop 3 ATR beim Broker, kein Ziel, Ausstieg vor 15:55
      # New York, 5 € Risiko, höchstens ein Trade je Markt. Nur Demo, Account 5 (geteilt mit pine-k5 und dem
      # Dow-Rücksetzer), nie das Hauptkonto des Gold-Bots. Regeln in suche/VORAB_vix_sprung_bot.yaml, Code
      # suche/vix_sprung_bot.py. Er holt den VIX nur ab 18:00 New York. Ohne Sprung ist der Tag damit erledigt, ohne
      # Kerzen vom Broker. Er schreibt nur journal/vix-sprung/ und journal/vix-sprung.json. Ein Fehler hier hält die
      # anderen Bots und das Journal nie auf.
      - name: VIX-Sprung (Account 5)
        id: vix_sprung
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_vix_sprung_bot.py
            touch .tests-ok/vix_sprung
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.vix_sprung_bot --dry-run
          else
            python -m suche.vix_sprung_bot
          fi

      # Williams %R auf US500 und US100 (Kirons Wunsch vom 20.11.2026: die stärksten Kandidaten direkt als Demo-Bot,
      # "baue danach aber weiter aus"): die Fassung williams_us der YouTube-Runde, im Test nicht bestanden (unter 100
      # Trades, z 2,35). Schließt Williams %R(2) der Sitzung 9:30 bis 16:00 New York unter -90, kauft er um 16:00 New
      # York. Ausstieg um 16:00 New York, wenn der Schluss über dem Vortageshoch liegt oder %R über -30, spätestens nach
      # 10 Sitzungen. Stop 3 ATR beim Broker, kein Ziel, 5 € Risiko, höchstens ein Trade je Markt. Nur Demo, Account 7
      # (geteilt mit Noise USD/JPY und dem 4-Std.-Ausbruch DAX, FTSE, Nikkei), nie das Hauptkonto des Gold-Bots. Regeln
      # in suche/VORAB_williams_bot.yaml, Code suche/williams_bot.py. Kerzen holt er nur in den 20 Minuten nach 16:00
      # New York. Er schreibt nur journal/williams-us/ und journal/williams-us.json. Ein Fehler hier hält die anderen
      # Bots und das Journal nie auf.
      - name: Williams %R (Account 7)
        id: williams
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_williams_bot.py
            touch .tests-ok/williams
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.williams_bot --dry-run
          else
            python -m suche.williams_bot
          fi

      # 4-Std.-Ausbruch auf Bitcoin und Ether (Kirons Wunsch vom 20.11.2026: die stärksten Kandidaten direkt als
      # Demo-Bot, "baue danach aber weiter aus"): die Fassung ausbruch4h_krypto der YouTube-Runde, im Test nicht
      # bestanden (2026 Gewinnfaktor 0,91, z 2,35). Schließt eine 4-Std.-Kerze über dem Hoch der 20 Kerzen davor und
      # passt der Tagestrend, kauft er, spiegelbildlich verkauft er. Stop hinter dem Tief der letzten 10 Kerzen beim
      # Broker, kein Ziel, Ausstieg nach 4 fertigen 4-Std.-Kerzen, 5 € Risiko, höchstens ein Trade je Markt. Nur Demo,
      # Account 5 (geteilt mit pine-k5, dem Dow-Rücksetzer und dem VIX-Sprung), nie das Hauptkonto des Gold-Bots. Regeln in
      # suche/VORAB_krypto_ausbruch4h_bot.yaml, Code suche/krypto4h_bot.py. Kerzen holt er nur in den 25 Minuten nach
      # dem Schluss einer 4-Std.-Kerze und solange ein Trade offen ist. Er schreibt nur journal/krypto-ausbruch4h/ und
      # journal/krypto-ausbruch4h.json. Ein Fehler hier hält die anderen Bots und das Journal nie auf.
      - name: 4-Std.-Ausbruch Bitcoin, Ether (Account 5)
        id: krypto4h
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_krypto4h_bot.py
            touch .tests-ok/krypto4h
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.krypto4h_bot --dry-run
          else
            python -m suche.krypto4h_bot
          fi

      # Bündel aus 9 Bots, seit 26.11.2026 ohne Gold (Kirons Wahl vom 20.11.2026 16:20 UTC "Ein Konto mit 9 Bots" und
      # vom 26.11.2026 09:59 UTC "Zwei Bündel auf einem Konto"): erfindet kein Signal. Er kopiert jeden neuen Trade der
      # Rücksetzer US500 und US100, des Noise-Bands Nasdaq, der Scalper DAX und Nasdaq und des 4-Std.-Ausbruchs
      # DAX/FTSE/Nikkei auf das Demokonto "Vortag USDJPY" (geteilt mit dem Gold-Bündel, Vortag GBP/USD und dem ruhenden
      # pine-hand), mit 7 € Risiko auf gedachte 700 €. Seine offenen Gold-Kopien laufen zu Ende. Stop und Ziel sind die
      # Kurse der Quelle, schließt die Quelle, schließt er die Kopie. Ein Konto-Wächter prüft vor jeder Kopie Margin und
      # Bremse. Er läuft nach den Bots dieses Laufs, damit er ihre neuen Trades schon sieht. Kopien kommen bis zu 15
      # Minuten nach der Quelle. Nur Demo, nie das Hauptkonto, nie ein Konto eines Mitglieds, nie eine fremde Position,
      # auch keine Kopie des Gold-Bündels. Regeln in suche/VORAB_buendel9_ohne_gold.yaml, Code suche/buendel_bot.py. Er
      # schreibt nur journal/buendel9/ und journal/buendel9.json. Ein Fehler hier hält die anderen Bots und das Journal
      # nie auf.
      - name: Bündel ohne Gold (Vortag USDJPY)
        id: buendel
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_buendel_bot.py
            touch .tests-ok/buendel
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.buendel_bot --regel suche/VORAB_buendel9_ohne_gold.yaml --dry-run
          else
            python -m suche.buendel_bot --regel suche/VORAB_buendel9_ohne_gold.yaml
          fi

      # Gold-Bündel (Kirons Wunsch vom 26.11.2026 09:53 UTC, die Gold-Bots als eigenes Bündel zu trennen, und seine Wahl
      # 09:59 UTC "Zwei Bündel auf einem Konto"): derselbe Code wie das Bündel ohne Gold, mit eigener Regeldatei. Er
      # kopiert jeden neuen Trade von Gold-Bot C/B, Gold-Zonen und Gold 4-Std.-Ausbruch auf "Vortag USDJPY", Kauf oder
      # Verkauf wie die Quelle, mit 7 € Risiko auf eigene gedachte 700 €. Er läuft nach buendel9, fasst dessen Kopien nie
      # an und kopiert keinen Trade, den buendel9 schon kopiert hat. Regeln in suche/VORAB_gold_buendel_bot.yaml. Er
      # schreibt nur journal/gold-buendel/ und journal/gold-buendel.json. Die Tests teilt er mit dem Schritt davor (keine
      # eigene Testgruppe). Ein Fehler hier hält die anderen Bots und das Journal nie auf.
      - name: Gold-Bündel (Vortag USDJPY)
        id: gold_buendel
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ] && [ ! -f .tests-ok/buendel ]; then
            python -m pytest -q tests/test_buendel_bot.py
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.buendel_bot --regel suche/VORAB_gold_buendel_bot.yaml --dry-run
          else
            python -m suche.buendel_bot --regel suche/VORAB_gold_buendel_bot.yaml
          fi

      # Demo-Vergleich aller Bots und Aufstiegs-Check (Kirons Wunsch vom 05.11.2026: Profite abgleichen und bewerten;
      # suche/vergleich.py, suche/VORAB_aufstieg.yaml). Liest nur das Journal, spricht mit keinem Broker, ein paar
      # Sekunden. Schreibt journal/vergleich.json und journal/vergleich.md; ohne neuen Trade ändern sie sich höchstens
      # einmal am Tag. Ein Fehler hier hält die Bots und das Journal nie auf und zählt nicht zu den sechzehn Testgruppen.
      - name: Demo-Vergleich aller Bots
        id: vergleich
        if: ${{ !cancelled() && inputs.dry_run != true }}
        continue-on-error: true
        env:
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_vergleich.py
          fi
          python -m suche.vergleich --schreiben

      # Kombinierer (Kirons Wunsch vom 20.11.2026, suche/kombinierer.py, suche/VORAB_schatten.yaml): rechnet die Gruppe
      # aller Bots und die Kern-Kombi als EIN Konto mit 1.000 € und 10 € Risiko je Trade, einmal ohne Grenzen und
      # einmal mit den Regeln eines echten Kontos (höchstens 3 offen, einer je Markt, Tagesstopp, Gesamtbremse). Liest
      # nur das Journal über suche/vergleich.py, spricht mit keinem Broker, keine Order, kein Bot liest das Ergebnis.
      # Schreibt journal/kombinierer.json und journal/kombinierer.md, ohne neuen Trade höchstens einmal am Tag neu. Ein
      # Fehler hier hält die Bots und das Journal nie auf.
      # Dazu seit 25.11.2026 das Gold-Duo doppelt (Kirons Wahl "g11", suche/gold_duo.py, suche/VORAB_gold_duo_doppelt.yaml):
      # Gold-Bot C/B und Pine-K5 mit doppeltem Einsatz auf einem gedachten Konto mit 1.000 €, nur Trades ab dem Siegel.
      # Eine Zählung ohne Order, als eigener Abschnitt im selben Bericht.
      - name: Kombinierer (alle Bots als ein Konto)
        id: kombinierer
        if: ${{ !cancelled() && inputs.dry_run != true }}
        continue-on-error: true
        env:
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_kombinierer.py tests/test_gold_duo.py
          fi
          python -m suche.kombinierer --schreiben

      # Kunden-Stimmung von Capital.com (Idee 6 aus Kirons Ideen-Buch, 18.11.2026, suche/stimmung.py): liest je Lauf,
      # wie viel Prozent der Kunden auf den Märkten der Bots long sind, und hängt eine Zeile an journal/stimmung.jsonl
      # an. Nur lesen: keine Order, kein Bot liest die Datei, keine Regel hängt daran. Ausgewertet wird erst nach der
      # vorab versiegelten Regel suche/VORAB_stimmung.yaml. Fehlt die Stimmung (Capital.com, Anmeldung), steht der Grund
      # in der Zeile unter "fehler", und der Schritt endet trotzdem ohne Fehler. Die Wache meldet ihn nur, wenn sein Test
      # oder das Programm selbst kaputt ist. Ein Fehler hier hält die Bots und das Journal nie auf.
      - name: Kunden-Stimmung mitschreiben
        id: stimmung
        if: ${{ !cancelled() && inputs.dry_run != true }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_stimmung.py
          fi
          python -m suche.stimmung

      # Nur wenn alle sechzehn Testgruppen in diesem Lauf grün waren, merkt sich GitHub den Stand (Cache, kostet nichts).
      - name: Alle Testgruppen grün?
        id: alle
        if: ${{ !cancelled() && steps.tests_ok.outputs.cache-hit != 'true' }}
        run: |
          n=$(ls .tests-ok | wc -l)
          if [ "$n" -ge 16 ]; then echo "gruen=true" >> "$GITHUB_OUTPUT"; else echo "Nur $n von 16 Testgruppen grün"; fi

      - name: Grünen Stand merken
        if: ${{ !cancelled() && steps.alle.outputs.gruen == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .tests-ok
          key: ${{ steps.code.outputs.key }}

      # Wache (Projekt-Prüfung 11.11.2026, suche/wache.py): prüft alle Siegel der Regeldateien und zählt, welcher
      # Bot-Schritt in Folge gescheitert ist. Die Bot-Schritte laufen mit continue-on-error, ein Fehler dort ließ den
      # Lauf und das Lebenszeichen bisher grün. Fehlt ein Siegel oder scheitert ein Schritt dreimal in Folge, geht eine
      # Meldung an healthchecks.io (Checks "siegel" und "bot-schritte"), Kiron bekommt eine E-Mail. Liest nur, ändert
      # keinen Bot, schreibt nur journal/wache.json und nur, wenn sich die Zählung ändert. Zählt nicht zu den sechzehn
      # Testgruppen. Ein Fehler hier hält nichts auf.
      - name: Wache (Siegel und stille Fehler der Bot-Schritte)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python -m suche.wache --lauf demo-bots

      - name: Journal sichern
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: |
          git config user.name "demo-bots"
          git config user.email "demo-bots@users.noreply.github.com"
          git add journal/
          if git diff --cached --quiet; then
            echo "Nichts Neues im Journal"
          else
            git commit -m "Demo-Bots: $(date -u +%Y-%m-%dT%H:%MZ)"
            # Bis zu 5 Versuche: am 04.11.2026 gingen 3 von 5 Läufen verloren (zweimal "Internal Server Error" von
            # GitHub, einmal ein Merge genau zwischen Pull und Push).
            for i in 1 2 3 4 5; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push fehlgeschlagen (Versuch $i), neuer Versuch in $((i * 5)) s"
              sleep $((i * 5))
            done
            exit 1
          fi

      # Alarm von außen (healthchecks.io): Bleibt diese Meldung aus, bekommt Kiron eine E-Mail. Zeitplan und Wartezeit
      # richtet takt.yml im privaten Repo ein (ops/lebenszeichen.py). Ohne das Secret HC_PING_KEY passiert nichts.
      # Der Schlüssel ist ein Secret und erscheint im Protokoll nur als ***.
      - name: Lebenszeichen
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
          ERGEBNIS: ${{ job.status }}
        run: |
          if [ -z "$HC_PING_KEY" ]; then echo "Kein HC_PING_KEY: kein Lebenszeichen"; exit 0; fi
          pfad=""
          if [ "$ERGEBNIS" != "success" ]; then pfad="/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "https://hc-ping.com/${HC_PING_KEY}/demo-bots${pfad}?create=1"
          echo "Lebenszeichen demo-bots gesendet ($ERGEBNIS)"
