# Kirons Auswahl der Demo-Strategien (suche/demo_pruefung.py). Nur Capital.com-Demo, nie echtes Geld.
#
# Kirons Wunsch vom 04.11.2026, 12:27 UTC: "jetzt reduziere auf die profitabelsten oder auf die an denen ich noch
# arbeiten kann um sie zu verbessern damit ich diese profite innerhalb eines jahres oder ein paar monaten erzielen kann".
#
# Grundlage: dieselben Trades wie die Bewertung 2025-2026 (Projektdateien strategie-suche/bewertung/trades.csv),
# Euro mit 1 % Risiko je Trade (10 € bis zum Stop bei 1.000 €) und Hebelgrenze (suche/bewertung.py euro(), korrigiert
# 04.11.2026 13:20 UTC). Entscheidend ist 2025: Die Runde-3-Bots (Brent, Dow-Short, Kupfer,
# Intel, Japan 225, DAX) wurden auf März bis Oktober 2026 ausgesucht, ihr 2026 ist geschönt. 2025 haben alle sechs
# verloren. Alle 17 zusammen: 2025 -251 €, 2026 +1.816 €, größter Rückgang 969 €.
#
# behalten: in beiden Jahren im Plus und entweder viel Gewinn (Vortag EUR/USD, GBP/USD) oder ein sehr hoher
#   Gewinnfaktor auf einem gemeinsamen Konto, das kein weiteres Konto kostet (Top 3). Zusammen 2025-2026 +693 €
#   (2025 +460 €, 2026 +232 €), größter Rückgang 95 €, 18 von 22 Monaten im Plus.
# verbessern: läuft weiter, daran wird gearbeitet (eigene Threads, neue Tests vorab festgelegt).
# abschalten: öffnet keinen neuen Trade mehr. Eine offene Position läuft nach ihren Regeln zu Ende, dann wird das Konto
#   frei (journal/konten.json "frei") und geht an die nächste Strategie, die die Regel in VORAB_wechsel.yaml besteht.
# Vortag auf weiteren Paaren (verbessern bis 05.11.2026): vorab festgelegter Test vom 05.11.2026 auf 9 Paaren, gewählt
#   auf 2015-2024, geurteilt nur auf 2025-2026. Nur GBP/JPY bestanden, knapp (2026 fast null, Rückgang 150 €). Erst
#   ab Kirons Merge steht GBP/JPY unter behalten und damit auch in der Kombi (VORAB_aufstieg.yaml).
# labor: Kirons Entscheidung vom 05.11.2026, 11:07 UTC (suche/VORAB_labor.yaml): die vier am 04.11.2026 abgeschalteten,
#   aber bestandenen Strategien laufen als Vorwärtstest auf freien Demokonten, getrennt vom Kern (nicht in der Kombi,
#   nicht im Wochen-Check der Kern-Strategien). Die Gründe fürs Abschalten gelten weiter und stehen dabei.
# Brent (Labor) abschalten: Kirons Wort vom 10.11.2026 10:35 UTC (Entscheidungskarte "Soll Brent sein Demokonto
#   (Account 1) behalten?", Antwort "Konto frei machen"). Account 1 wird frei für den nächsten Bot, der seine Prüfung
#   besteht und öfter handelt.
format: 1
auswahl:
  seit: "2026-11-04"
  behalten:
    r6-vortag-eurusd: "2025 +309 €, 2026 +116 €, Rückgang 46 €"
    r6-vortag-gbpusd: "2025 +100 €, 2026 +65 €, Rückgang 69 €"
    us500-ruecksetzer: "2025 +31 €, 2026 +24 €, Rückgang 4 €, Gewinnfaktor 5,8 (Top 3 auf einem Konto)"
    r5-ruecksetzer-us100: "2025 +6 €, 2026 +17 €, Rückgang 15 €, Gewinnfaktor 1,9 (Top 3 auf einem Konto)"
    r7-nasdaq-noise-long: "2025 +13 €, 2026 +10 €, Rückgang 3 €, Gewinnfaktor 3,5 (Top 3 auf einem Konto)"
    r6-vortag-gbpjpy: "2025 +189 €, 2026 +0,5 €, Rückgang 150 €, Gewinnfaktor 1,45 (Test vom 05.11.2026, Stop 0,5 ATR)"
  verbessern:
    gold-cb: >-
      2025 +328 €, 2026 -30 €. Kirons Pine auf dem Hauptkonto, eigener Plan bis Ende Januar 2027; jeden Morgen eine
      neue Idee im Gold-Lernjournal.
  labor:
    r6-noise-usdjpy: "+49 € aus 254 Trades (2025 +2 €), Gewinnfaktor 1,4, kaum vom Zufall zu unterscheiden"
    r6-london-gbpusd: "+59 € aus 53 Trades, Gewinnfaktor 1,4, kaum vom Zufall zu unterscheiden"
    r5-ruecksetzer-us30: "+19 € aus 23 Trades, Gewinnfaktor 1,5, kaum vom Zufall zu unterscheiden"
  abschalten:
    oil-brent: >-
      Kirons Wort vom 10.11.2026 10:35 UTC: Konto frei machen. Runde-3-Urteil durchgefallen, 0 Trades in rund 4
      Handelstagen Labor, 2025 -177 €; Account 1 geht an den nächsten Bot, der seine Prüfung besteht und öfter handelt.
