name: Tests

# Alle Tests der Bots bei jedem PR. In einem öffentlichen Repo kostet das keine Minuten.
# Nur pull_request (nie pull_request_target): PRs aus fremden Kopien laufen ohne Schlüssel und ohne Schreibrecht.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
