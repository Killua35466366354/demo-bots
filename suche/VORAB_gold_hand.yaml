# Gold-Hand-Bot: Gold Short und Long ohne Stop und Ziel, mit Trade-Abfänger, Nachricht aufs Handy, Kiron geht selbst raus.
# Code gold/hand_bot.py, Tests tests/test_gold_hand.py. Nur Capital.com-DEMO, nie echtes Geld.
#
# Kirons Wunsch vom 06.11.2026 15:51 UTC (Thread "Gold-Short-Bot verbessern"): "den Shortbot ... und jetzt hier diesen
# Longbot ... zusammentun und dann ohne Stop-Loss, ohne nix und ohne Backtest ... dass der mir immer dann eine Nachricht
# sendet, wann er sozusagen in den Trade reingeht, dass ich den sozusagen selber rausgehen kann". Darum gibt es hier
# keine Hürde und kein Urteil: Das Ergebnis hängt an Kirons eigenem Rausgehen und steht nur zur Information im Journal.
# Kein Kandidat für echtes Geld, nicht in der automatischen 15/40-Prüfung, kein Zwilling nach VORAB_zwilling.yaml.
# Festgelegt vor dem ersten Trade (16:48 UTC). Nachtrag Trade-Abfänger auf Kirons Wunsch vom 06.11.2026 17:49 UTC
# ("mache kein Stop-Loss direkt rein ... nur dieser Trade-Abfänger ... der einfach nur die Trades abfängt, die falsch
# genommen werden oder zur falschen Zeit"), statt des Stop-Agenten von 17:12 UTC, der nie live war. Sein datiertes Wort
# im Sinne der Eine-Woche-Regel.

format: 1
gold_hand:
  konto:
    id: "332263750966269086"    # Account 5, Kirons Wahl; der Gold-Short-Bot öffnet dort nichts mehr
    nie: Hauptkonto des Gold-Bots (Endung 3150) und seine Dateien
  signale: >-
    Wie gold/short_bot.simuliere (gross_klein_3, gross_box_kerze, gross_box auf 15-Min.-Kerzen, nur fertige 1-Std.- und
    4-Std.-Kerzen, Kerze "jetzt" mit dem aktuellen Kurs), Verkäufe und Käufe. In einer Kerze gilt der erste Short (Seiten
    in dieser Reihenfolge), ein Long nur, wenn es dort keinen Short gibt. Ein Signal nur einmal je Kerze und nur frisch
    (sb.frisch).
  fuehrung: >-
    Marktorder ohne Stop und ohne Ziel. Der Bot schließt nie selbst. Kiron schließt, wann er will. Stop und Ziel setzt
    nur der Trade-Abfänger.
  abfaenger:
    fehltrade: >-
      Wie der Prüfer des Gold-Short-Bots (gold/short_bot.fehl_index, FEHL_F 0,5): läuft der Kurs 0,5 R gegen den Trade,
      bevor Ziel 1 der Strategie erreicht ist (beides in derselben Kerze zählt als Fehltrade), setzt der Abfänger den
      Stop der Strategie (1 R) und das Ziel auf den Einstieg. So endet ein falscher Trade bei null, wenn der Kurs
      zurückkommt, und höchstens bei etwa -1 R.
    notbremse: Liegt ein Trade ohne Stop 1 R oder mehr im Minus (auch nach Ziel 1), Stop 0,5 R hinter den Kurs.
    hinter_dem_stop: Liegt der Kurs beim Fehltrade schon hinter dem Stop der Strategie, Stop 0,5 R hinter den Kurs.
    einmal: Der Abfänger setzt je Position einmal und bewegt danach nichts mehr.
    kiron: Hat Kiron selbst Stop oder Ziel gesetzt oder geändert, lässt der Abfänger diese Position in Ruhe (eine Nachricht).
    pruefung: alle 15 Minuten im Lauf des Bots, auf den 15-Min.-Kerzen seit dem Einstieg und dem aktuellen Kurs.
    nachricht: Jedes Eingreifen und jeder Schluss durch Stop oder Ziel des Abfängers.
    test: >-
      Keiner, auf Kirons Wunsch. Zum Vergleich: In Runde 12f hat ein Ausstieg bei null für Fehltrades Gewinner
      abgeschnitten, im Gold-Short-Bot ist der Prüfer Teil der Strategie (PF_R 0,95).
  groesse:
    risiko_eur_je_strategie_r: 5.0      # nur zum Rechnen der Größe, kein Stop beim Broker
    max_oz_trade: 1.0
    max_oz_zusammen: 2.0
    max_goldpositionen: 4               # alle Goldpositionen auf dem Konto, auch Kirons eigene
  gegenrichtung: >-
    Ist eine Goldposition in die andere Richtung offen, öffnet der Bot nichts (kein Hedging, die Order würde sonst die
    alte Position schließen) und schickt nur die Nachricht.
  hintergrund: >-
    Kirons Wunsch vom 06.11.2026 16:12 UTC ("damit keine völlig unnötigen Trades genommen werden"), wie der
    Richtungs-Check von Gold-Bot 2.0 (gold/v2/richtung.py) auf den Kerzen von Capital.com: letzter fertiger Tagesschluss
    gegen seinen 50-Tage-Schnitt und letzter fertiger 4-Std.-Schluss gegen seine EMA 50. Beide darüber, kein Short. Beide
    darunter, kein Long. Uneinig oder zu wenig Daten, beides erlaubt. Beim Gold-Bot C/B war dieser Check im Test nicht
    besser als Zufall (Runde 3, 02.11.2026); hier gilt er ohne Test auf Kirons Wunsch.
  news_agent:
    termine: >-
      Fed-Zinsentscheid, US-Inflation (CPI) und US-Arbeitsmarkt (NFP) aus gold/v2/termine.yaml, dazu alle roten
      USD-Termine aus dem ForexFactory-Wochenkalender (höchstens alle 6 Stunden geholt).
    pause_vor_min: 60
    pause_nach_min: 30
    schock: Pause, solange eine der letzten 3 fertigen 15-Min.-Kerzen eine Spanne über 3 x ATR 20 davor hatte.
    warnung_vor_min: 45     # sind Goldpositionen offen, einmal je Termin eine Warnung
    schlagzeilen: >-
      Jede Nachricht zeigt bis zu 3 Gold-Schlagzeilen der letzten 6 Stunden (Google News RSS "spot gold"). Sie
      entscheiden nichts, Kiron ordnet sie selbst ein.
  nachricht: >-
    Bei jedem Einstieg und jedem ausgelassenen frischen Signal eine Nachricht über ntfy an das Thema im GitHub-Secret
    NTFY_THEMA: Richtung, Größe, Kurs, Seite, Kerze, Fehltrade-Grenze, Stop und Ziel 1 der Strategie. Nimmt ntfy
    eine Nachricht nicht an (Grenze je IP-Adresse), holt der nächste Lauf sie bis 12 Std. lang nach. Ein eigener
    ntfy-Zugang im Secret NTFY_TOKEN ist erlaubt. Beim ersten echten Lauf eine Start-Nachricht.
  journal: journal/gold-hand/ (state.json, log.jsonl, trades.jsonl, nachrichten.jsonl) und journal/gold-hand.json
  aenderung: Nur über einen PR, den Kiron merged.
