name: Demo-Bots (Strategie-Suche, nur Demokonto)

# Alle Demo-Bots außer dem Gold-Bot in EINEM Lauf (nur Capital.com-DEMO, nie echtes Geld). Stand 05.11.2026 handeln:
# Vortag EUR/USD und GBP/USD (suche/r6_bots.py) und die Top 3 auf dem Konto "US500" (US500-Rücksetzer, US100-Rücksetzer,
# Nasdaq Noise-Band Long; suche/us500_bot.py, suche/r7_nasdaq_bot.py). Die alten Runde-3-Bots in suche/demo_bots.py
# sind alle abgelöst und öffnen nichts mehr.
#
# Uhr: Kirons cron-job.org-Auftrag "Demo-Bots", Minute 1, 16, 31 und 46, seit Kirons Wunsch vom 05.11.2026 17:33 UTC
# jeden Tag rund um die Uhr. Im öffentlichen Repo kostet ein Lauf keine Minuten, das Fenster 10 bis 22 Uhr Berlin
# (Sparen vom 05.11.2026 morgens) brauchte es nicht mehr. Davon hatten zwei Bots weniger als ihre Regel erlaubt: Brent
# (30-Minuten-Signale rund um die Uhr, Backtest ohne Uhrzeit-Grenze) verlor jedes Nachtsignal, Noise USD/JPY
# (Sitzung ab 8 Uhr London = 9 Uhr Berlin) seine erste Stunde. Wann ein Bot handeln darf, steht allein in seinen
# Regeln (Vortag 4:30 bis 16:45 New York, US-Bots in der US-Sitzung, London-Bot am Londoner Morgen); außerhalb davon
# rechnet ein Lauf nur und öffnet nichts. Jeder Lauf soll unter einer Minute bleiben. Offene Positionen haben ihren
# Stop beim Broker.
#
# Getrennt vom Gold-Bot-Lauf: Dieser Lauf schreibt nur journal/demo-bots* und journal/konten.json, der Gold-Bot nur seine eigenen Dateien. So
# kann ein Fehler hier nie das Journal des Gold-Bots stören. Gleiche Gruppe wie der Gold-Bot: Beide laufen nie
# gleichzeitig, der Gold-Bot hat damit immer seine eigene Sitzung bei Capital.com.
# Öffentliches Repo seit November 2026: keine Actions-Minuten, die Uhr bleibt cron-job.org.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur rechnen, keine Order"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  run:
    # Immer GitHubs Rechner: In einem öffentlichen Repo kostet das keine Minuten, und ein eigener Rechner wäre hier
    # ein Sicherheitsrisiko.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Mit dem Namen des Zweigs statt des festen Stands beim Anstoßen: Wartete der Lauf hinter dem Gold-Bot, holt er
      # so trotzdem den neuesten Stand der Demo-Bots.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Tests nur nach einer Code-Änderung und einmal am Tag (Minuten sparen, 05.11.2026): Die Tests brauchten gut die
      # Hälfte jedes 15-Minuten-Laufs, obwohl sich der Code zwischen zwei Läufen fast nie ändert. Der Schlüssel ist der
      # Stand aller Dateien außer journal/ und inbox/ plus das Datum. Waren alle acht Testgruppen mit genau diesem Stand
      # heute schon grün, springt jede Gruppe darüber. Sonst gilt wie immer: ohne grüne Tests kein Lauf.
      - name: Code-Stand für die Tests
        id: code
        run: |
          mkdir -p .tests-ok
          stand=$(git ls-tree -r HEAD | awk -F'\t' '$2 !~ /^(journal|inbox)\//' | sha256sum | cut -c1-16)
          echo "key=demo-tests-$(date -u +%F)-$stand" >> "$GITHUB_OUTPUT"

      - name: Heute mit diesem Stand schon grün?
        id: tests_ok
        uses: actions/cache/restore@v4
        with:
          path: .tests-ok
          key: ${{ steps.code.outputs.key }}
          lookup-only: true

      - name: Tests (ohne grüne Tests kein Lauf)
        env:
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_demo_bots.py tests/test_konten.py
            touch .tests-ok/demo
          fi

      - name: Prüfung nach 15/40 Demo-Trades (deutlich schlechtere Bots wechseln, suche/VORAB_wechsel.yaml)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_demo_pruefung.py tests/test_labor.py
            touch .tests-ok/pruefung
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.demo_pruefung --dry-run
          else
            python -m suche.demo_pruefung
          fi

      - name: Demo-Bots
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.demo_bots --dry-run
          else
            python -m suche.demo_bots
          fi

      # Trend-Rücksetzer US500 (Runde 5b bestanden, Kirons Regel: gute Strategien auf eigene Demo-Konten): eigener
      # Vorwärtstest auf einem eigenen neuen Demokonto (Name "US500"), Entscheidung einmal am Tag um 15 Uhr New York
      # (suche/us500_bot.py, suche/VORAB_us500.yaml). Ein Fehler hier hält die anderen Bots und das Journal nie auf.
      - name: Trend-Rücksetzer US500
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_us500_bot.py tests/test_suche_runde5.py
            touch .tests-ok/us500
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.us500_bot --dry-run
          else
            python -m suche.us500_bot
          fi

      # Runde 6 (Kirons Wahl vom 04.11.2026): Vortageshoch/-tief USD/JPY (bestanden), London-Stunde GBP/USD und
      # Noise-Band USD/JPY (knapp nicht bestanden, Kirons Wunsch), jeder nur auf einem eigenen Demokonto mit passendem
      # Namen ("Vortag", "London"/"GBPUSD", "Noise"). Dazu der Zwilling: Backtest-Motor auf den Capital.com-Kerzen jedes
      # fertigen Tages, mit EUR/USD und GBP/USD als Schatten (suche/r6_bots.py, suche/VORAB_r6_demo.yaml). Ein Fehler hier
      # hält die anderen Bots und das Journal nie auf.
      - name: Runde-6-Bots (Vortag USD/JPY, EUR/USD, GBP/USD; London GBP/USD; Noise USD/JPY)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_r6_bots.py
            touch .tests-ok/r6
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.r6_bots --dry-run
          else
            python -m suche.r6_bots
          fi

      # Runde 7 (Kirons Wahl vom 04.11.2026 "Nur Nasdaq Noise-Band Long"): Noise-Band nur Long auf US100, Notstop 5 x
      # Tages-ATR, raus am 5. Handelstag um 16 Uhr New York, nur auf einem eigenen Demokonto mit "Nasdaq" im Namen
      # (suche/r7_nasdaq_bot.py, suche/VORAB_r7_nasdaq.yaml). Ein Fehler hier hält die anderen Bots und das Journal nie auf.
      - name: Noise-Band Long Nasdaq (Runde 7)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_r7_nasdaq_bot.py
            touch .tests-ok/r7
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.r7_nasdaq_bot --dry-run
          else
            python -m suche.r7_nasdaq_bot
          fi

      # Gold-Short-Bot (Kirons Wunsch vom 06.11.2026 12:51 UTC): die große Strategie nur Shorts aus Runde 12h
      # (portfolio-manager suche/VORAB_runde12h.yaml, Variante gross_short, im Backtest durchgefallen, PF_R 0,94) auf
      # Konto 5, das er mit dem Dow-Laborbot teilt. Nur Demo, nie das Hauptkonto des Gold-Bots. Regeln und Urteil in
      # suche/VORAB_gold_short.yaml, Code gold/short_bot.py. Schreibt nur journal/gold-short/ und journal/gold-short.json.
      # Ein Fehler hier hält die anderen Bots und das Journal nie auf.
      # Seit Kirons Wahl vom 06.11.2026 ruht der Gold-Short-Bot: Konto 5 gehört dem Gold-Hand-Bot (nächster Schritt), der
      # dieselben Shorts ohne Stop nimmt. Zwei Gold-Bots ohne Hedging auf einem Konto würden sich gegenseitig Positionen
      # schließen. Die Tests laufen weiter, der Bot öffnet nichts mehr. Er hatte bis dahin keinen Trade.
      - name: Gold-Short-Bot (ruht, Konto 5 an den Gold-Hand-Bot)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_gold_short.py tests/test_tiktok_schatten.py
            touch .tests-ok/gold_short
          fi
          echo "Gold-Short-Bot ruht seit 06.11.2026 (Kirons Wahl: Konto 5 an den Gold-Hand-Bot), keine Order"

      # Gold-Hand-Bot (Kirons Wunsch vom 06.11.2026 15:51 UTC): Einstiege der drei Seiten des Gold-Short-Bots, Shorts und
      # Longs, ohne Stop und Ziel, mit Trade-Abfänger (Kirons Wunsch vom 06.11.2026 17:49 UTC). Kiron bekommt über
      # ntfy eine Nachricht und schließt selbst. Nur Demo, Account 5,
      # nie das Hauptkonto des Gold-Bots. Regeln in suche/VORAB_gold_hand.yaml, Code gold/hand_bot.py. Schreibt nur
      # journal/gold-hand/ und journal/gold-hand.json. Ein Fehler hier hält die anderen Bots und das Journal nie auf.
      - name: Gold-Hand-Bot (Short und Long mit Trade-Abfänger, Nachricht aufs Handy)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          NTFY_THEMA: ${{ secrets.NTFY_THEMA }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_gold_hand.py
            touch .tests-ok/gold_hand
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m gold.hand_bot --dry-run
          else
            python -m gold.hand_bot
          fi

      # Gold Groß-Box (Kirons Wahl vom 10.11.2026 17:35 UTC nach der neuen Bewertung 2024-26): die große Box aus
      # Runde 12d (Seite gross_box), Kauf und Verkauf, ein Drittel bei 1 R, dann Einstand, der Rest bis zur neuen Box,
      # 5 € Risiko je Trade, höchstens 3 offen. Nur Demo, Account 6 (geteilt mit dem Laborbot London GBP/USD), nie das
      # Hauptkonto des Gold-Bots. Regeln in suche/VORAB_gold_grossbox.yaml, Code gold/grossbox_bot.py. Schreibt nur
      # journal/gold-grossbox/ und journal/gold-grossbox.json. Ein Fehler hier hält die anderen Bots und das Journal nie auf.
      - name: Gold Groß-Box (Account 6)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_grossbox_bot.py
            touch .tests-ok/gold_grossbox
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m gold.grossbox_bot --dry-run
          else
            python -m gold.grossbox_bot
          fi

      # London-Breakout EUR/USD und Asien-ORB GBP/NZD: beendet am 04.11.2026, Kirons Entscheidung nach der
      # Langzeit-Prüfung 2015-2025 (suche/VORAB_langzeit.yaml, Gewinnfaktor 0,93 und 0,77, beide unter 1,0). Beide hatten
      # noch kein eigenes Konto und keinen Trade. Der Code (suche/london_bot.py, suche/asien_bot.py) bleibt im Repo,
      # läuft aber nicht mehr. Dieser Schritt hält nur ihren Stand im Journal richtig.
      - name: Beendete Vorwärtstests markieren (London, Asien)
        if: ${{ !cancelled() && inputs.dry_run != true }}
        continue-on-error: true
        run: |
          python - <<'EOF'
          import json, pathlib
          neu = "beendet am 04.11.2026 (Kirons Entscheidung nach der Langzeit-Prüfung 2015-2025)"
          for name in ("london-bot", "asien-bot"):
              p = pathlib.Path("journal") / f"{name}.json"
              if p.exists():
                  d = json.loads(p.read_text(encoding="utf-8"))
                  if d.get("status") != neu:
                      d["status"] = neu
                      p.write_text(json.dumps(d, ensure_ascii=False, indent=1), encoding="utf-8")
          EOF

      # Demo-Vergleich aller Bots und Aufstiegs-Check (Kirons Wunsch vom 05.11.2026: Profite abgleichen und bewerten;
      # suche/vergleich.py, suche/VORAB_aufstieg.yaml). Liest nur das Journal, spricht mit keinem Broker, ein paar
      # Sekunden. Schreibt journal/vergleich.json und journal/vergleich.md; ohne neuen Trade ändern sie sich höchstens
      # einmal am Tag. Ein Fehler hier hält die Bots und das Journal nie auf und zählt nicht zu den acht Testgruppen.
      - name: Demo-Vergleich aller Bots
        if: ${{ !cancelled() && inputs.dry_run != true }}
        continue-on-error: true
        env:
          TESTS_OK: ${{ steps.tests_ok.outputs.cache-hit }}
        run: |
          if [ "$TESTS_OK" != "true" ]; then
            python -m pytest -q tests/test_vergleich.py
          fi
          python -m suche.vergleich --schreiben

      # Nur wenn alle acht Testgruppen in diesem Lauf grün waren, merkt sich GitHub den Stand (Cache, kostet nichts).
      - name: Alle Testgruppen grün?
        id: alle
        if: ${{ !cancelled() && steps.tests_ok.outputs.cache-hit != 'true' }}
        run: |
          n=$(ls .tests-ok | wc -l)
          if [ "$n" -ge 8 ]; then echo "gruen=true" >> "$GITHUB_OUTPUT"; else echo "Nur $n von 8 Testgruppen grün"; fi

      - name: Grünen Stand merken
        if: ${{ !cancelled() && steps.alle.outputs.gruen == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .tests-ok
          key: ${{ steps.code.outputs.key }}

      - name: Journal sichern
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: |
          git config user.name "demo-bots"
          git config user.email "demo-bots@users.noreply.github.com"
          git add journal/
          if git diff --cached --quiet; then
            echo "Nichts Neues im Journal"
          else
            git commit -m "Demo-Bots: $(date -u +%Y-%m-%dT%H:%MZ)"
            # Bis zu 5 Versuche: am 04.11.2026 gingen 3 von 5 Läufen verloren (zweimal "Internal Server Error" von
            # GitHub, einmal ein Merge genau zwischen Pull und Push).
            for i in 1 2 3 4 5; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push fehlgeschlagen (Versuch $i), neuer Versuch in $((i * 5)) s"
              sleep $((i * 5))
            done
            exit 1
          fi

      # Alarm von außen (healthchecks.io): Bleibt diese Meldung aus, bekommt Kiron eine E-Mail. Zeitplan und Wartezeit
      # richtet takt.yml im privaten Repo ein (ops/lebenszeichen.py). Ohne das Secret HC_PING_KEY passiert nichts.
      # Der Schlüssel ist ein Secret und erscheint im Protokoll nur als ***.
      - name: Lebenszeichen
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
          ERGEBNIS: ${{ job.status }}
        run: |
          if [ -z "$HC_PING_KEY" ]; then echo "Kein HC_PING_KEY: kein Lebenszeichen"; exit 0; fi
          pfad=""
          if [ "$ERGEBNIS" != "success" ]; then pfad="/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "https://hc-ping.com/${HC_PING_KEY}/demo-bots${pfad}?create=1"
          echo "Lebenszeichen demo-bots gesendet ($ERGEBNIS)"
