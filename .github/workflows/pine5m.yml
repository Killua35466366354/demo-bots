name: Pine-Gold-Bots (5 Min., nur Demokonto)

# Kirons TradingView-Strategien A (Long) und B (Short) auf 5-Min.-Gold-Kerzen, zwei Bots mit denselben Einstiegen
# (gold/pine5m_bot.py, Regeln und Test suche/VORAB_pine5m.yaml). Kirons Wunsch vom 09.11.2026 20:41 UTC.
# Nur Capital.com-DEMO, nie echtes Geld:
#   pine-k5   auf "Account 5" (…9086, seit Kirons Wort vom 10.11.2026 07:29 UTC): ohne Stop und Ziel, Nachricht aufs
#             Handy, Kiron geht selbst raus, Long und Short gleichzeitig (Hedging), Termin-Pause, Hintergrund und
#             Trade-Abfänger wie beim Gold-Hand-Bot (suche/VORAB_pine5m_konto5.yaml).
#   pine-hand auf Konto "Vortag USDJPY" (…4094): umgezogen, betreut nur noch offene Trades.
#   pine-tp3  auf Konto "US500" (…8878): Take-Profit +3 €, kein Stop, Notausstieg bei zusammen -250 €.
# Dazu im selben Lauf die 3 Scalper mit Open-Filter auf "Account 1" (…5310, Kirons Wort vom 10.11.2026 12:16 UTC,
# suche/scalper_bot.py, Regeln suche/VORAB_scalping_opens.yaml): Nasdaq und DAX Eröffnungskerze (15 Min.), Nikkei letzte
# halbe Stunde (5 Min.). Eigener Schritt: Ein Fehler dort hält die Pine-Bots nie auf.
# Dazu die Gold-Staffel auf "Account 1" (Kirons Wahl vom 10.11.2026 16:37 UTC, suche/gold_staffel_bot.py, Regeln
# suche/VORAB_gold_staffel.yaml): kopiert neue Trades des Gold-Bots C/B mit Take-Profits bei 2/4/6 R, der Wächter zieht
# den Stop nach TP1 bzw. TP2 nach. Der Gold-Bot selbst bleibt unverändert. Auch ein eigener Schritt.
#
# Uhr: alle 5 Minuten, 3 Minuten nach jedem Kerzenschluss. GitHubs eigener Zeitplan ist die Reserve (er kann sich
# verspäten). Pünktlich wird es mit einem cron-job.org-Auftrag auf workflow_dispatch zu denselben Minuten. Laufen
# beide, wartet der zweite und findet nichts Neues: Jede Kerze zählt je Bot nur einmal.
#
# Eigene Gruppe statt der des Gold-Bots: GitHub behält je Gruppe nur einen wartenden Lauf und bricht den älteren ab,
# ein Lauf alle 5 Minuten würde dort sonst wartende Gold- oder Demo-Bot-Läufe abbrechen. Der Kontowechsel bei
# Capital.com gilt je Sitzung, jeder Lauf meldet sich selbst an. Zusätzlich prüft der Bot vor jeder Order, welches
# Konto in seiner Sitzung aktiv ist. Im öffentlichen Repo kostet ein Lauf keine Minuten.
on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur rechnen, keine Order"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pine5m
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests (ohne grüne Tests kein Lauf)
        run: python -m pytest -q tests/test_pine5m.py

      - name: Pine-Gold-Bots
        id: pine
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          NTFY_THEMA: ${{ secrets.NTFY_THEMA }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m gold.pine5m_bot --dry-run
          else
            python -m gold.pine5m_bot
          fi

      - name: Scalper mit Open-Filter (Account 1)
        id: scalper
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python -m pytest -q tests/test_scalper_bot.py
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.scalper_bot --dry-run
          else
            python -m suche.scalper_bot
          fi

      - name: Gold-Staffel (Account 1)
        id: staffel
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python -m pytest -q tests/test_gold_staffel_bot.py
          if [ "$DRY_RUN" = "true" ]; then
            python -m suche.gold_staffel_bot --dry-run
          else
            python -m suche.gold_staffel_bot
          fi

      # Wache (Projekt-Prüfung 11.11.2026, suche/wache.py): zählt, ob der Scalper- oder Staffel-Schritt in Folge
      # scheitert (beide laufen mit continue-on-error und ließen den Lauf bisher grün). Schreibt nur
      # journal/pine-wache.json und nur, wenn sich die Zählung ändert. Gemeldet wird im 15-Minuten-Lauf (demo-bots.yml).
      - name: Wache (stille Fehler der Bot-Schritte)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python -m suche.wache --lauf pine5m

      - name: Journal sichern
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: |
          git config user.name "demo-bots"
          git config user.email "demo-bots@users.noreply.github.com"
          git add -A -- 'journal/pine-*' || true
          git add -A -- 'journal/scalp-*' 2>/dev/null || true   # getrennt: fehlen diese Dateien, bleibt Pine dabei
          git add -A -- 'journal/gold-staffel*' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nichts Neues im Journal"
          else
            git commit -m "Pine-Gold: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push fehlgeschlagen (Versuch $i), neuer Versuch in $((i * 5)) s"
              sleep $((i * 5))
            done
            exit 1
          fi

      # Alarm von außen (healthchecks.io, Projekt-Prüfung 11.11.2026): Bleibt diese Meldung aus, bekommt Kiron eine
      # E-Mail. In diesem Lauf handeln zwei Bots ohne Stop, und ihr Abfänger arbeitet nur hier. Bisher hätte niemand
      # gemerkt, wenn der Lauf ausfällt. Zeitplan und Wartezeit richtet takt.yml im privaten Repo ein
      # (ops/lebenszeichen.py, Check "pine5m"). Ohne das Secret HC_PING_KEY passiert nichts. Der Schlüssel ist ein
      # Secret und erscheint im Protokoll nur als ***.
      - name: Lebenszeichen
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
          ERGEBNIS: ${{ job.status }}
        run: |
          if [ -z "$HC_PING_KEY" ]; then echo "Kein HC_PING_KEY: kein Lebenszeichen"; exit 0; fi
          pfad=""
          if [ "$ERGEBNIS" != "success" ]; then pfad="/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "https://hc-ping.com/${HC_PING_KEY}/pine5m${pfad}?create=1"
          echo "Lebenszeichen pine5m gesendet ($ERGEBNIS)"
