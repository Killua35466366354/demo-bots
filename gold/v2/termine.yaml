# Wichtige US-Termine für Gold (News-Check von Gold-Bot 2.0). Uhrzeit in New Yorker Ortszeit, der Code rechnet sie
# mit Sommer- und Winterzeit nach UTC um. Nur angekündigte Termine; unerwartete Nachrichten fängt die Schock-Pause ab.
#
# Quellen (abgerufen am 02.11.2026):
#   Fed-Zinsentscheide: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm (zweiter Sitzungstag, 14:00)
#   Inflation (CPI):    https://www.bls.gov/bls/news-release/cpi.htm und https://www.bls.gov/schedule/news_release/cpi.htm
#   Arbeitsmarkt (NFP): https://www.bls.gov/bls/news-release/empsit.htm und https://www.bls.gov/schedule/news_release/empsit.htm
# Im Herbst 2025 fielen wegen des Haushaltsstillstands Berichte aus oder kamen später (CPI 24.10. und 18.12.2025,
# NFP 20.11. und 16.12.2025); hier stehen die echten Veröffentlichungstage.
# Einmal im Jahr ergänzen, sobald Fed und BLS das nächste Jahr veröffentlichen. Der Bot warnt, wenn die Liste ausläuft.

